<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>NEXUS</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="night-clear">
  <div class="sky" aria-hidden="true">
    <div class="sky-gradient"></div>
    <div class="sky-sun"></div>
    <canvas id="sky-canvas"></canvas>
    <div class="sky-flash"></div>
    <div class="sky-vignette"></div>
  </div>

  <div id="login" class="login hidden">
    <form id="login-form" class="glass login-card">
      <div class="brand"><span class="brand-mark"></span>NEXUS</div>
      <p>Inserisci il token API (HUB_API_TOKEN nel file .env).</p>
      <input id="login-token" type="password" autocomplete="off" placeholder="Token" required>
      <button type="submit" class="btn-primary">Entra</button>
    </form>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>NEXUS</div>
      <div class="chips">
        <span id="alarm-chip" class="chip"></span>
        <span id="status-chip" class="chip chip-status"><span class="dot"></span><span id="status-text">Connessione...</span></span>
      </div>
    </header>

    <div class="layout">
      <section class="hero">
        <div id="greeting" class="greeting"></div>
        <div class="clock"><span id="clock-hm">--:--</span><span id="clock-s" class="clock-s"></span></div>
        <div id="date" class="date"></div>
        <p id="summary" class="summary"></p>

        <div class="weather-hero">
          <div id="wx-icon" class="wx-icon"></div>
          <div class="wx-main">
            <div class="wx-temp"><span id="wx-temp">--</span><span class="deg">°</span></div>
            <div id="wx-desc" class="wx-desc"></div>
            <div id="wx-city" class="wx-city"></div>
          </div>
        </div>
        <div id="wx-stats" class="wx-stats"></div>

        <div class="glass forecast">
          <div class="card-head">
            <h2>Prossime 12 ore</h2>
            <span class="legend"><i class="legend-temp"></i>Temperatura <i class="legend-rain"></i>Pioggia</span>
          </div>
          <div id="forecast" class="forecast-body"></div>
        </div>
      </section>

      <section class="glass card agenda">
        <div class="card-head">
          <h2>Agenda</h2>
          <span id="events-count" class="pill"></span>
        </div>
        <div id="next-event" class="next-event"></div>
        <ol id="timeline" class="timeline"></ol>
      </section>

      <section class="glass card tasks">
        <div class="card-head">
          <h2>Task</h2>
          <span id="tasks-count" class="pill"></span>
        </div>
        <div id="task-stats" class="task-stats"></div>
        <form id="task-form" class="task-form">
          <input id="task-title" placeholder="Aggiungi un task..." maxlength="200" required autocomplete="off">
          <input id="task-due" type="date" title="Scadenza">
          <button type="submit" class="btn-primary" title="Aggiungi">+</button>
        </form>
        <ul id="tasks" class="task-list"></ul>
      </section>
    </div>

    <button id="assistant-orb" class="assistant-orb" type="button" title="Parla con l'assistente (tasto /)">
      <span class="orb"></span><span id="assistant-orb-label">Lilith</span>
    </button>

    <aside id="assistant" class="assistant glass" aria-hidden="true" aria-label="Assistente">
      <header class="assistant-head">
        <div class="assistant-id">
          <span class="orb"></span>
          <div><strong id="assistant-name">Lilith</strong><small id="assistant-sub">Assistente personale</small></div>
        </div>
        <div class="assistant-tools">
          <button id="assistant-new" class="icon-btn" type="button" title="Nuova conversazione"></button>
          <button id="assistant-close" class="icon-btn" type="button" title="Chiudi (Esc)"></button>
        </div>
      </header>
      <div id="assistant-log" class="assistant-log" aria-live="polite"></div>
      <div id="assistant-suggestions" class="assistant-suggestions"></div>
      <form id="assistant-form" class="assistant-form">
        <textarea id="assistant-input" rows="1" maxlength="2000" placeholder="Chiedi qualcosa..." autocomplete="off"></textarea>
        <button type="submit" class="btn-primary send" title="Invia"></button>
      </form>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
