<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>NEXUS</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="night-clear">
  <div class="sky" aria-hidden="true">
    <div class="sky-gradient"></div>
    <div class="sky-sun"></div>
    <canvas id="sky-canvas"></canvas>
    <div class="sky-flash"></div>
    <div class="sky-vignette"></div>
  </div>

  <div id="login" class="login hidden">
    <form id="login-form" class="glass login-card">
      <div class="brand"><span class="brand-mark"></span>NEXUS</div>
      <p>Inserisci il token API (HUB_API_TOKEN nel file .env).</p>
      <input id="login-token" type="password" autocomplete="off" placeholder="Token" required>
      <button type="submit" class="btn-primary">Entra</button>
    </form>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>NEXUS</div>
      <div class="chips">
        <span id="alarm-chip" class="chip"></span>
        <button id="sync-chip" class="chip chip-button" type="button" title="Dettagli della sync">Nessuna sync</button>
        <span id="status-chip" class="chip chip-status"><span class="dot"></span><span id="status-text">Connessione...</span></span>
        <button id="settings-btn" class="chip chip-button chip-icon" type="button" title="Impostazioni (tasto I)" aria-label="Impostazioni"></button>
      </div>
    </header>

    <div class="layout">
      <section class="hero">
        <div id="greeting" class="greeting"></div>
        <div class="clock"><span id="clock-hm">--:--</span><span id="clock-s" class="clock-s"></span></div>
        <div id="date" class="date"></div>
        <p id="summary" class="summary"></p>

        <div class="weather-hero">
          <div id="wx-icon" class="wx-icon"></div>
          <div class="wx-main">
            <div class="wx-temp"><span id="wx-temp">--</span><span class="deg">°</span></div>
            <div id="wx-desc" class="wx-desc"></div>
            <div id="wx-city" class="wx-city"></div>
          </div>
        </div>
        <div id="wx-stats" class="wx-stats"></div>

        <div class="glass forecast">
          <div class="card-head">
            <h2>Prossime 12 ore</h2>
            <span class="legend"><i class="legend-temp"></i>Temperatura <i class="legend-rain"></i>Pioggia</span>
          </div>
          <div id="forecast" class="forecast-body"></div>
        </div>
      </section>

      <div class="column">
        <section class="glass card agenda">
          <div class="card-head">
            <h2>Agenda</h2>
            <span id="events-count" class="pill"></span>
          </div>
          <div id="next-event" class="next-event"></div>
          <ol id="timeline" class="timeline"></ol>
          <div id="agenda-week" class="agenda-week" hidden></div>
        </section>

        <section class="glass card week">
          <div class="card-head"><h2>Prossimi giorni</h2></div>
          <ol id="week" class="week-list"></ol>
        </section>
      </div>

      <section class="glass card tasks">
        <div class="card-head">
          <h2>Task</h2>
          <span id="tasks-count" class="pill"></span>
        </div>
        <div id="task-stats" class="task-stats"></div>
        <form id="task-form" class="task-form">
          <input id="task-title" placeholder="Aggiungi un task..." maxlength="200" required autocomplete="off">
          <input id="task-due" type="date" title="Scadenza">
          <button type="submit" class="btn-primary" title="Aggiungi">+</button>
        </form>
        <ul id="tasks" class="task-list"></ul>
      </section>
    </div>

    <div id="assistant-launcher" class="assistant-launcher">
      <button id="assistant-orb" class="assistant-orb" type="button" title="Scrivi all'assistente (tasto /)">
        <span class="orb"></span><span id="assistant-orb-label">Lilith</span>
      </button>
      <button id="assistant-orb-mic" class="orb-mic hidden" type="button" title="Parla con l'assistente (tasto M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></button>
    </div>

    <div id="morning" class="morning" hidden>
      <div class="morning-card glass" role="dialog" aria-labelledby="morning-title">
        <div id="morning-title" class="morning-title">Buongiorno</div>
        <div id="morning-date" class="morning-date"></div>
        <div class="morning-weather">
          <div id="morning-icon" class="morning-icon"></div>
          <div>
            <div id="morning-temp" class="morning-temp"></div>
            <div id="morning-desc" class="morning-desc"></div>
          </div>
        </div>
        <ul id="morning-rows" class="morning-rows"></ul>
        <div class="morning-hint">Tocca per chiudere</div>
      </div>
    </div>

    <div id="settings" class="settings" hidden>
      <div class="settings-card glass" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <nav class="settings-nav">
          <div id="settings-title" class="settings-title">Impostazioni</div>
          <div id="settings-menu" class="settings-menu"></div>
        </nav>
        <section id="settings-body" class="settings-body"></section>
        <button id="settings-close" class="icon-btn settings-close" type="button" title="Chiudi (Esc)"></button>
      </div>
    </div>

    <aside id="assistant" class="assistant glass" aria-hidden="true" aria-label="Assistente">
      <header class="assistant-head">
        <div class="assistant-id">
          <span class="orb"></span>
          <div><strong id="assistant-name">Lilith</strong><small id="assistant-sub">Assistente personale</small></div>
        </div>
        <div class="assistant-tools">
          <button id="assistant-history-btn" class="icon-btn" type="button" title="Storico conversazioni"></button>
          <button id="assistant-new" class="icon-btn" type="button" title="Nuova conversazione"></button>
          <button id="assistant-close" class="icon-btn" type="button" title="Chiudi (Esc)"></button>
        </div>
      </header>
      <div id="assistant-history" class="assistant-history" role="list"></div>
      <div id="assistant-log" class="assistant-log" aria-live="polite"></div>
      <div id="assistant-suggestions" class="assistant-suggestions"></div>
      <form id="assistant-form" class="assistant-form">
        <textarea id="assistant-input" rows="1" maxlength="2000" placeholder="Chiedi qualcosa..." autocomplete="off"></textarea>
        <button id="assistant-mic" type="button" class="mic hidden" title="Parla (tasto M)"></button>
        <button type="submit" class="btn-primary send" title="Invia"></button>
      </form>
    </aside>
  </main>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
